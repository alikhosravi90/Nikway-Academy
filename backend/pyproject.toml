[project]
name = "nikway-academy-api"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pyjwt[crypto]>=2.10,<3", "alembic>=1.15,<2", "jsonschema==4.26.0"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pip-audit>=2.9,<3"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
