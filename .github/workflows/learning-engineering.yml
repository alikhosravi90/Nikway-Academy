name: Learning Engineering validation
on:
  push:
    branches: [learning-engineering]
  pull_request:
    paths: ['learning-engineering/**', '.github/workflows/learning-engineering.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: learning-engineering
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m engine.cli validate records
      - run: python -m engine.pilot
      - name: Verify explicit gate outcomes
        run: python missions/LE-05/ci_gates.py
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r learning-engineering/missions/LE-03/requirements-lock.txt
      - name: Export pinned source modules
        run: python learning-engineering/missions/LE-03/snapshot.py
      - name: Test real-module offline integration
        working-directory: learning-engineering/missions/LE-03
        run: python -m unittest -v test_bridge
      - name: Generate integration receipt
        working-directory: learning-engineering/missions/LE-03
        run: python bridge.py
