server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 resolver 127.0.0.11 valid=10s ipv6=off;
 resolver_timeout 5s;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Cache-Control "no-store" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:18480; frame-src http://localhost:18480; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' http://localhost:18480" always;
 location /api/ {
  set $api_upstream api:8000;
  proxy_pass http://$api_upstream;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
 }
 location / { try_files $uri $uri/ /index.html; }
}
