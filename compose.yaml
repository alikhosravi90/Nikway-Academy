name: nikway-academy-local
services:
  postgres:
    image: nikway-academy-postgres:16-hardened
    build: ./infra/postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/local-init.py}
    volumes:
      - academy-db-v2:/var/lib/postgresql/data
      - ./infra/runtime/init.sql:/docker-entrypoint-initdb.d/01-academy.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 1.0
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:18480
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./infra/runtime/academy-realm.json:/opt/keycloak/data/import/academy-realm.json:ro
    ports: ['127.0.0.1:18480:8080']
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
  migrate:
    build: ./backend
    command: [python, -m, app.migrate]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://academy_owner:${ACADEMY_OWNER_PASSWORD}@postgres:5432/academy
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1.0
    restart: 'no'
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://academy_app:${ACADEMY_APP_PASSWORD}@postgres:5432/academy
      OIDC_ISSUER: http://localhost:18480/realms/academy
      OIDC_JWKS_URL: http://keycloak:8080/realms/academy/protocol/openid-connect/certs
      OIDC_AUDIENCE: academy-api
      TOOLS_ENABLED: "true"
      CORS_ORIGINS: http://localhost:18401,http://127.0.0.1:18401
    ports: ['127.0.0.1:18400:8000']
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 1.0
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:18401:80']
    depends_on: [api]
    mem_limit: 256m
    cpus: 0.5
volumes:
  academy-db-v2:
